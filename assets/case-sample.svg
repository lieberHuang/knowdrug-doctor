<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080"><rect width="800" height="1080" fill="#f4f7fb"/><rect x="42" y="36" width="716" height="1008" rx="12" fill="#fff" stroke="#dfe7f1"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#2a4163"><text x="82" y="100" font-size="29" font-weight="600">日达仙 · 病历资料核对记录</text><text x="82" y="144" font-size="18" fill="#7188a5">匿名病例 A</text><path d="M82 168h636" stroke="#e2e9f3"/><text x="82" y="217" font-size="20">患者姓名</text><rect x="205" y="195" width="185" height="31" rx="3" fill="#1d2738"/><text x="424" y="217" font-size="20">病案号</text><rect x="525" y="195" width="193" height="31" rx="3" fill="#1d2738"/><text x="82" y="274" font-size="20">联系方式</text><rect x="205" y="252" width="251" height="31" rx="3" fill="#1d2738"/><rect x="643" y="247" width="75" height="75" rx="3" fill="#1d2738"/><text x="82" y="369" font-size="23" font-weight="600">病例概述</text><text x="82" y="413" font-size="20">本记录用于整理药品资料与病例讨论问题。</text><text x="82" y="455" font-size="20">已移除患者身份信息，检查资料待补充。</text><text x="82" y="533" font-size="23" font-weight="600">用药信息</text><text x="82" y="577" font-size="20">药品：日达仙</text><text x="82" y="619" font-size="20">用药记录与合并用药清单：待核对</text><text x="82" y="697" font-size="23" font-weight="600">讨论问题</text><text x="82" y="741" font-size="20">1. 是否已提供与讨论相关的完整病史？</text><text x="82" y="783" font-size="20">2. 检查结果是否包含日期与参考信息？</text><text x="82" y="825" font-size="20">3. 药品资料是否记录具体来源与版本？</text><path d="M82 884h636" stroke="#e2e9f3"/><text x="82" y="934" font-size="18" fill="#91a1b8">患者身份字段已使用不透明黑块遮挡</text><text x="82" y="980" font-size="17" fill="#a3afbf">病例资料示例</text></g></svg>
